<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>KD IA 2.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 12px; }
        .app { max-width: 1000px; margin: 0 auto; }
        .header { background: #1e293b; border-radius: 24px 24px 0 0; padding: 16px; text-align: center; }
        .header h1 { color: #c084fc; }
        .badge { background: #22c55e; padding: 4px 12px; border-radius: 40px; font-size: 10px; display: inline-block; margin-top: 8px; }
        
        .botoes-topo { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: #1e293b; justify-content: center; }
        .btn { padding: 8px 16px; border: none; border-radius: 40px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-verde { background: #22c55e; color: white; }
        .btn-azul { background: #3b82f6; color: white; }
        .btn-roxo { background: #8b5cf6; color: white; }
        .btn-cinza { background: #334155; color: white; }
        .ativo { box-shadow: 0 0 0 2px #c084fc; }
        
        .lista-conversas { background: #1e293b; padding: 8px; max-height: 120px; overflow-y: auto; display: flex; gap: 8px; flex-wrap: wrap; }
        .conv-item { background: #0f172a; padding: 6px 12px; border-radius: 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; }
        .conv-item.active { background: #3b82f6; }
        .conv-del { background: #dc2626; border: none; color: white; padding: 2px 8px; border-radius: 20px; cursor: pointer; }
        
        .stats { background: #1e293b; padding: 4px 12px; font-size: 10px; color: #94a3b8; text-align: center; }
        .chat { background: #1e293b; height: 50vh; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 8px 14px; border-radius: 18px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
        .user { background: #2563eb; align-self: flex-end; }
        .ia { background: #334155; align-self: flex-start; border-left: 3px solid #c084fc; }
        .pensando { background: #334155; align-self: flex-start; padding: 8px 14px; border-radius: 18px; }
        
        .input-area { background: #0f172a; padding: 12px; display: flex; gap: 10px; border-radius: 0 0 24px 24px; }
        .input-area input { flex: 1; padding: 12px; border-radius: 40px; border: none; background: #1e293b; color: white; }
        .input-area button { padding: 12px 20px; border-radius: 40px; border: none; background: #22c55e; font-weight: bold; cursor: pointer; }
        .voz-btn { background: #8b5cf6; padding: 12px 16px; font-size: 18px; }
        footer { text-align: center; font-size: 10px; padding: 12px; color: #64748b; }
        .gravando { background: #ef4444 !important; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>KD IA 2.0</h1>
        <p>🧠 Conhecimento expandido | 🔍 DuckDuckGo grátis</p>
        <div class="badge">📚 +100 conceitos | 🌐 Busca sem chave</div>
    </div>
    
    <div class="botoes-topo">
        <button class="btn btn-verde" onclick="window.novaConversa()">+ Nova</button>
        <button id="btnRapido" class="btn btn-azul ativo" onclick="window.setModoRapido()">Rápido</button>
        <button id="btnRaciocinio" class="btn btn-roxo" onclick="window.setModoRaciocinio()">Raciocínio</button>
        <button class="btn btn-cinza" onclick="window.exportarConversas()">Exportar</button>
        <button class="btn btn-cinza" onclick="window.importarConversas()">Importar</button>
        <button class="btn btn-cinza" onclick="window.buscarConversas()">Buscar</button>
        <button id="btnLer" class="btn btn-cinza" onclick="window.toggleLeitura()">Ler</button>
    </div>
    
    <div id="listaConversas" class="lista-conversas"></div>
    <div class="stats" id="stats">🧠 Carregando...</div>
    <div id="chat" class="chat"></div>
    
    <div class="input-area">
        <input type="text" id="inputMsg" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') window.enviarMensagem()">
        <button id="btnVoz" class="voz-btn" onclick="window.iniciarVoz()">🎤</button>
        <button onclick="window.enviarMensagem()">Enviar</button>
    </div>
    
    <footer>🔍 Digite "pesquisar [assunto]" para buscar na web | DuckDuckGo grátis</footer>
</div>

<script>
// =====================================================
// TODAS AS FUNÇÕES USAM window. - GARANTE FUNCIONAMENTO
// =====================================================

// ========== CONHECIMENTO LOCAL ==========
const conhecimento = {
    "brasil": "🇧🇷 Brasil: Maior país da América do Sul. Capital: Brasília.",
    "argentina": "🇦🇷 Argentina: Capital: Buenos Aires.",
    "eua": "🇺🇸 Estados Unidos: Capital: Washington DC.",
    "japão": "🇯🇵 Japão: Capital: Tóquio.",
    "alemanha": "🇩🇪 Alemanha: Capital: Berlim.",
    "frança": "🇫🇷 França: Capital: Paris.",
    "fotosíntese": "🌱 Fotossíntese: Processo das plantas para produzir energia com luz solar.",
    "gravidade": "⬇️ Gravidade: Força que atrai corpos com massa. Na Terra é 9,8 m/s².",
    "dna": "🧬 DNA: Molécula que carrega a informação genética.",
    "mercurio": "🪐 Mercúrio: Planeta mais próximo do Sol.",
    "venus": "🪐 Vênus: Planeta mais quente do Sistema Solar.",
    "terra": "🌍 Terra: Nosso planeta. Único com vida conhecida.",
    "marte": "🔴 Marte: Planeta vermelho.",
    "jupiter": "🪐 Júpiter: Maior planeta do Sistema Solar.",
    "saturno": "🪐 Saturno: Famoso pelos seus anéis.",
    "cachorro": "🐕 Cachorro: Melhor amigo do homem.",
    "gato": "🐈 Gato: Animal doméstico independente.",
    "leão": "🦁 Leão: Rei da selva. Vive na África.",
    "elefante": "🐘 Elefante: Maior animal terrestre.",
    "pelé": "👑 Pelé: Maior jogador de futebol brasileiro. Três Copas.",
    "futebol": "⚽ Futebol: Esporte mais popular do mundo.",
    "html": "💻 HTML: Linguagem para criar páginas web.",
    "css": "🎨 CSS: Linguagem para estilizar páginas web.",
    "javascript": "⚡ JavaScript: Linguagem de programação para navegadores.",
    "python": "🐍 Python: Linguagem fácil, usada em dados e IA.",
    "descobrimento do brasil": "📅 22 de abril de 1500: Pedro Álvares Cabral chega ao Brasil.",
    "independência do brasil": "📅 7 de setembro de 1822: Independência do Brasil.",
    "samba": "🎵 Samba: Gênero musical brasileiro.",
    "feijoada": "🍛 Feijoada: Prato típico brasileiro com feijão preto.",
    "pizza": "🍕 Pizza: Prato italiano.",
    "sushi": "🍣 Sushi: Prato japonês."
};

// ========== BUSCA DUCKDUCKGO ==========
window.buscarDuckDuckGo = async function(consulta) {
    try {
        let termo = consulta.replace(/pesquisar|buscar|procurar|sobre|sobre o|sobre a/gi, "").trim();
        if (termo.length < 3) return "🔍 Digite algo mais específico para pesquisar.";
        
        const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(termo)}&format=json&no_html=1&skip_disambig=1`;
        const resposta = await fetch(url);
        const dados = await resposta.json();
        
        if (dados.AbstractText && dados.AbstractText.length > 0) {
            return `🔍 **${termo}**\n\n${dados.AbstractText}\n\n📚 Fonte: ${dados.AbstractURL || "DuckDuckGo"}`;
        }
        if (dados.Definition && dados.Definition.length > 0) {
            return `📖 **${termo}**\n\n${dados.Definition}`;
        }
        return `🔍 **"${termo}"**\n\n❌ Nada encontrado.\n\n💡 Tente "pesquisar ${termo}" de outra forma.`;
    } catch(erro) {
        return "❌ Erro de conexão. Verifique sua internet.";
    }
};

function precisaBuscar(pergunta) {
    let palavras = ["pesquisar", "buscar", "procurar", "pesquise", "busque", "procure"];
    let p = pergunta.toLowerCase();
    return palavras.some(palavra => p.startsWith(palavra) || p.includes(` ${palavra} `));
}

// ========== RESPOSTA ==========
window.gerarResposta = async function(mensagem) {
    let msg = mensagem.toLowerCase();
    
    for (let [chave, resposta] of Object.entries(conhecimento)) {
        if (msg.includes(chave)) return `📚 ${resposta}`;
    }
    
    let nums = msg.match(/\d+/g);
    if (nums && nums.length >= 2) {
        if (msg.includes("+")) return `${nums[0]} + ${nums[1]} = ${Number(nums[0]) + Number(nums[1])}`;
        if (msg.includes("-")) return `${nums[0]} - ${nums[1]} = ${Number(nums[0]) - Number(nums[1])}`;
        if (msg.includes("*") || msg.includes("x")) return `${nums[0]} x ${nums[1]} = ${Number(nums[0]) * Number(nums[1])}`;
        if (msg.includes("/")) return `${nums[0]} / ${nums[1]} = ${Number(nums[0]) / Number(nums[1])}`;
    }
    
    if (msg.startsWith("ensinar que")) {
        let partes = msg.replace("ensinar que", "").split(" e ");
        if (partes.length >= 2) {
            let tema = partes[0].trim();
            let resposta = partes[1].trim();
            let aprendizado = localStorage.getItem("kd_aprendizado");
            let dict = aprendizado ? JSON.parse(aprendizado) : {};
            dict[tema] = resposta;
            localStorage.setItem("kd_aprendizado", JSON.stringify(dict));
            return `🧠 Aprendi! "${tema}" significa "${resposta}".`;
        }
        return "Use: ensinar que [assunto] e [resposta]";
    }
    
    let aprendizadoSalvo = localStorage.getItem("kd_aprendizado");
    if (aprendizadoSalvo) {
        let dict = JSON.parse(aprendizadoSalvo);
        for (let [chave, resposta] of Object.entries(dict)) {
            if (msg.includes(chave.toLowerCase())) return `🧠 (Aprendi) ${resposta}`;
        }
    }
    
    if (precisaBuscar(mensagem)) {
        let termo = mensagem.replace(/^(pesquisar|buscar|procurar|pesquise|busque|procure)\s+/i, "").trim();
        if (termo.length > 2) return await window.buscarDuckDuckGo(termo);
    }
    
    if (msg.includes("oi") || msg.includes("ola")) {
        return "👋 Olá! Sou KD IA 2.0.\n\n📚 Tenho conhecimento local sobre: Geografia, Ciência, Planetas, Animais, História, Tecnologia, Esportes.\n\n🔍 Digite 'pesquisar [assunto]' para buscar na web grátis!\n\nComo posso ajudar?";
    }
    
    if (msg.includes("obrigado")) return "😊 Por nada! Estou aqui para ajudar!";
    
    return `📚 Não sei sobre isso.\n\n🔍 Tente "pesquisar ${mensagem.slice(0, 30)}" para buscar na web!`;
};

// ========== VARIÁVEIS ==========
let conversas = {};
let conversaAtual = null;
let modoRapido = true;
let lerAtivo = false;
let enviando = false;
let synth = window.speechSynthesis;
let recognition = null;

// ========== CONVERSAS ==========
function salvar() {
    localStorage.setItem("kd_conversas_final", JSON.stringify(conversas));
    localStorage.setItem("kd_atual_final", conversaAtual);
}

function carregar() {
    let salvo = localStorage.getItem("kd_conversas_final");
    if (salvo) conversas = JSON.parse(salvo);
    if (Object.keys(conversas).length === 0) {
        let id = Date.now().toString();
        conversas[id] = {
            id: id,
            titulo: "Conversa 1",
            data: new Date().toLocaleString(),
            msgs: [{ texto: "🧠 Olá! Sou KD IA 2.0\n\n📚 Tenho conhecimento local e 🔍 posso buscar na web grátis!\n\nDigite 'pesquisar [assunto]' para começar!", tipo: "ia" }]
        };
    }
    conversaAtual = localStorage.getItem("kd_atual_final");
    if (!conversaAtual || !conversas[conversaAtual]) conversaAtual = Object.keys(conversas)[0];
    window.atualizarStats();
}

window.atualizarStats = function() {
    let total = Object.keys(conhecimento).length;
    let statsDiv = document.getElementById("stats");
    if (statsDiv) statsDiv.innerHTML = `🧠 ${total} conceitos | 🔍 DuckDuckGo grátis | Modo: ${modoRapido ? "⚡ Rápido" : "🐢 Raciocínio"}`;
};

window.renderizarLista = function() {
    let lista = document.getElementById("listaConversas");
    if (!lista) return;
    lista.innerHTML = "";
    for (let id in conversas) {
        let conv = conversas[id];
        let div = document.createElement("div");
        div.className = "conv-item" + (id === conversaAtual ? " active" : "");
        div.innerHTML = `<span>${conv.titulo}</span><button class="conv-del" data-id="${id}">X</button>`;
        div.querySelector("span").onclick = () => window.mudarConversa(id);
        div.querySelector(".conv-del").onclick = (e) => { e.stopPropagation(); window.deletarConversa(id); };
        lista.appendChild(div);
    }
};

window.mudarConversa = function(id) { conversaAtual = id; salvar(); window.renderizarLista(); window.renderizarChat(); };
window.deletarConversa = function(id) { delete conversas[id]; let ids = Object.keys(conversas); if (ids.length === 0) window.novaConversa(); else { conversaAtual = ids[0]; salvar(); window.renderizarLista(); window.renderizarChat(); } };
window.novaConversa = function() { let id = Date.now().toString(); conversas[id] = { id: id, titulo: "Conversa " + (Object.keys(conversas).length + 1), data: new Date().toLocaleString(), msgs: [{ texto: "🧠 Nova conversa! Busca DuckDuckGo ativada!", tipo: "ia" }] }; conversaAtual = id; salvar(); window.renderizarLista(); window.renderizarChat(); };
window.renderizarChat = function() {
    let chatDiv = document.getElementById("chat");
    if (!chatDiv) return;
    chatDiv.innerHTML = "";
    if (!conversas[conversaAtual]) return;
    conversas[conversaAtual].msgs.forEach(msg => {
        let div = document.createElement("div");
        div.className = "msg " + msg.tipo;
        div.innerText = msg.texto;
        chatDiv.appendChild(div);
    });
    chatDiv.scrollTop = chatDiv.scrollHeight;
};

window.adicionarMsg = function(texto, tipo) {
    let conv = conversas[conversaAtual];
    if (!conv) return;
    conv.msgs.push({ texto: texto, tipo: tipo });
    if (tipo === "user" && conv.titulo.includes("Conversa")) conv.titulo = texto.slice(0, 20);
    salvar();
    window.renderizarChat();
    window.renderizarLista();
};

window.enviarMensagem = async function() {
    if (enviando) return;
    let input = document.getElementById("inputMsg");
    let texto = input.value.trim();
    if (!texto) return;
    
    enviando = true;
    window.adicionarMsg(texto, "user");
    input.value = "";
    
    let chatDiv = document.getElementById("chat");
    let pensando = document.createElement("div");
    pensando.className = "pensando";
    pensando.innerText = modoRapido ? "🔍 processando..." : "🧠 pensando...";
    chatDiv.appendChild(pensando);
    
    setTimeout(async () => {
        let resposta = await window.gerarResposta(texto);
        pensando.remove();
        window.adicionarMsg(resposta, "ia");
        if (lerAtivo && synth) {
            let utterance = new SpeechSynthesisUtterance(resposta.replace(/[📚🧠🔍🌐💡⭐]/g, ''));
            utterance.lang = 'pt-BR';
            synth.speak(utterance);
        }
        enviando = false;
    }, modoRapido ? 500 : 1000);
};

// ========== FUNÇÕES DOS BOTÕES ==========
window.setModoRapido = function() { 
    modoRapido = true; 
    let btnR = document.getElementById("btnRapido");
    let btnC = document.getElementById("btnRaciocinio");
    if(btnR) btnR.classList.add("ativo");
    if(btnC) btnC.classList.remove("ativo");
    window.atualizarStats();
};

window.setModoRaciocinio = function() { 
    modoRapido = false; 
    let btnR = document.getElementById("btnRapido");
    let btnC = document.getElementById("btnRaciocinio");
    if(btnC) btnC.classList.add("ativo");
    if(btnR) btnR.classList.remove("ativo");
    window.atualizarStats();
};

window.exportarConversas = function() { 
    let blob = new Blob([JSON.stringify(conversas)], {type: "application/json"}); 
    let a = document.createElement("a"); 
    a.href = URL.createObjectURL(blob); 
    a.download = "kd_ia_backup.json"; 
    a.click(); 
    URL.revokeObjectURL(a.href); 
};

window.importarConversas = function() { 
    let input = document.createElement("input"); 
    input.type = "file"; 
    input.accept = "application/json"; 
    input.onchange = (e) => { 
        let reader = new FileReader(); 
        reader.onload = (ev) => { 
            try { 
                conversas = JSON.parse(ev.target.result); 
                salvar(); 
                window.renderizarLista(); 
                window.renderizarChat(); 
                alert("Importado!"); 
            } catch(err) { 
                alert("Erro ao importar"); 
            } 
        }; 
        reader.readAsText(e.target.files[0]); 
    }; 
    input.click(); 
};

window.buscarConversas = function() { 
    let termo = prompt("Digite o termo de busca:"); 
    if (!termo) return; 
    let res = []; 
    for (let id in conversas) {
        for (let msg of conversas[id].msgs) {
            if (msg.texto.toLowerCase().includes(termo.toLowerCase())) { 
                res.push(`${conversas[id].titulo}: ${msg.texto.slice(0,50)}`); 
            }
        }
    }
    alert(res.length ? res.join("\n") : "Nada encontrado"); 
};

window.toggleLeitura = function() { 
    lerAtivo = !lerAtivo; 
    let btn = document.getElementById("btnLer");
    if(btn) btn.style.background = lerAtivo ? "#22c55e" : ""; 
    alert("Leitura " + (lerAtivo ? "ativada" : "desativada")); 
};

window.iniciarVoz = function() {
    if (!('webkitSpeechRecognition' in window)) { alert("Use Google Chrome."); return; }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    let vozBtn = document.getElementById("btnVoz");
    recognition.onstart = () => { if(vozBtn) vozBtn.classList.add("gravando"); };
    recognition.onend = () => { if(vozBtn) vozBtn.classList.remove("gravando"); };
    recognition.onresult = (e) => { 
        document.getElementById("inputMsg").value = e.results[0][0].transcript; 
        window.enviarMensagem(); 
    };
    recognition.start();
};

// ========== INICIAR ==========
carregar();
window.renderizarLista();
window.renderizarChat();
</script>
</body>
    </html>
